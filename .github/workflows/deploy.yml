name: Deploy to GitHub Pages

on:
  push:
    # only a version tag (e.g. `v0.1.0`, pushed via `git tag vX.Y.Z && git
    # push origin vX.Y.Z`) publishes to Pages - a plain push to main no
    # longer does, so the live site's version (scripts/git-version.mjs)
    # always reads as a clean release tag, never a "N commits past" one
    tags: ['v*.*.*']
  workflow_dispatch:

# no baseline token rights - each job below declares exactly what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read # actions/checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run tsc
      - run: npm test

  deploy:
    needs: test
    permissions:
      contents: read # actions/checkout
      pages: write # publish to GitHub Pages
      id-token: write # OIDC token for actions/deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # full history + tags, so `git describe` (scripts/git-version.mjs)
          # can find the nearest release tag - default checkout is shallow
          # and tag-less
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      # a second, plain copy of the same dist/ (the Pages artifact above is
      # packaged for actions/deploy-pages's own OIDC flow, not something a
      # later job can just untar) - lets `release` attach the exact bytes
      # that got published, rather than rebuilding and risking drift
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          include-hidden-files: true

  release:
    # only for an actual version-tag push - workflow_dispatch has no tag to
    # release, and this only runs once `deploy` has actually published the
    # tagged build, so a release never appears for a version the site isn't
    # live at yet
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Package dist and checksum it
        run: |
          tar -czf "lnurl-wallet-${GITHUB_REF_NAME}.tar.gz" -C dist .
          sha256sum "lnurl-wallet-${GITHUB_REF_NAME}.tar.gz" > "lnurl-wallet-${GITHUB_REF_NAME}.tar.gz.sha256"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "lnurl-wallet-${GITHUB_REF_NAME}.tar.gz" \
            "lnurl-wallet-${GITHUB_REF_NAME}.tar.gz.sha256"
