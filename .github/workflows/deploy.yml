name: Deploy to GitHub Pages

on:
  push:
    # only a version tag (e.g. `v0.1.0`, pushed via `git tag vX.Y.Z && git
    # push origin vX.Y.Z`) publishes to Pages - a plain push to main no
    # longer does, so the live site's version (scripts/git-version.mjs)
    # always reads as a clean release tag, never a "N commits past" one
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run tsc
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # full history + tags, so `git describe` (scripts/git-version.mjs)
          # can find the nearest release tag - default checkout is shallow
          # and tag-less
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
